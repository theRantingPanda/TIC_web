# Render Static Site.
#
# ⚠ THIS FILE IS NOT APPLIED. Verified against the live Render API on 2026-08-12: the
# `tic-web` service (srv-d9sogvijobas73fouu7g) was created through the dashboard, not
# from this blueprint, so nothing here governs it. Its actual configuration is:
#
#   branch          main          autoDeploy    yes, on commit
#   buildCommand    npm run build publishPath   out
#   env vars        none          routes        the six redirects below
#
# ✓ CLEARED (2026-08-17). This block used to warn that the /blog, /speciality-insurance
# and /income-preservation-1 redirects were not yet on the service and that those three
# paths would 404 the moment the branch deployed. They were added, and all three were
# verified against the live site on 2026-08-17: each returns 301 to its documented
# destination, as do /home-1, /file-access and /file. Six redirects, all serving.
#
# ⚠ AMENDED, THEN ✓ CLEARED, both 2026-08-18. Two of those six briefly served the wrong
# thing: /file-access and /file still 301'd to /forms, retired the day before, so both
# landed on a 404. They were removed from this file and deleted on the service, and both
# were re-checked live afterwards — each now returns a direct 404 with no redirect. The
# other four were re-checked in the same pass and still serve their documented
# destinations. Four routes here, four serving: this file and the service agree again.
#
# The warning is recorded as cleared rather than deleted, because the drift it describes
# is permanent while this file and the service are maintained separately, and a future
# addition here starts in exactly the same state. Check the live path before assuming a
# redirect in this file is doing anything.
#
# The redirects were MISSING from the service until 2026-08-12 — they existed only in
# this file, so /home-1, /file-access and /file returned 404 on the live site instead of
# redirecting. They are now configured directly on the service. If you change a redirect
# here you must change it there too, or adopt this file as a Blueprint so that stops
# being true. Note adopting it would also create `tic-help-redirect` below, a service
# for a hostname that does not exist.
#
# `npm run verify:urls` cannot catch that class of drift: it asserts a redirect-only
# path emits no artifact in out/, which is necessary but says nothing about whether
# Render serves the redirect. Check the service's routes when changing this file.
#
# ✓ CONFIRMED NOT A RECREATE (2026-08-18). After the above was written the service was
# reportedly recreated to clear this. The service ID is still srv-d9sogvijobas73fouu7g —
# the same one recorded at the top of this file — so it is the same service and the publish
# directory was never emptied. A genuine replacement must show a DIFFERENT id. Until it
# does, assume nothing has been removed.
#
# ⚠⚠ REDIRECT RULES MATCH THE EXACT PATH. A rule on /blog does NOT cover /blog.html, and
# where a stale artifact exists at the .html path it is served instead, bypassing the
# redirect entirely. Proven live, not assumed:
#
#   /blog                    301 -> /services       /blog.html                   200
#   /income-preservation-1   301 -> /services       /income-preservation-1.html  200
#   /home-1                  301 -> /               /home-1.html                 404
#
# /home-1 is clean only because nothing was ever built at that path. THE OTHER TWO ARE
# LEAKING: Wix-era pages still readable beside their own redirects, which the URL contract
# reads as fully redirected. Both are collateral of the additive-publish problem above and
# go when the publish directory is finally emptied.
#
# The consequence for any stopgap: rules are needed per path INCLUDING .html and .txt
# variants, not one per logical page. /single-post/* collapses twelve; the rest are
# individual. And test the first rule before writing thirty — if Render serves an existing
# file before evaluating rules, the approach is void.
#
# ⚠⚠ RENDER'S STATIC PUBLISH IS ADDITIVE. DELETING A FILE DOES NOT UNPUBLISH IT.
# (Established 2026-08-18, after an earlier version of this note got it wrong.)
#
# Files absent from a new deploy are NOT removed — everything ever published stays
# published. Every page and asset retired on 2026-08-17 was still live the next day:
#
#   /knowledge.html                    200   the full page, 43KB
#   /forms.html                        200   and it names an insurer 6 times
#   /single-post/<12 articles>.html    200
#   /forms/manifest.json, the PDF      200
#
# The proof it is the platform and not the build: the live /.build-stamp.json carries an
# inputHash and inputFileCount IDENTICAL to a local build of the same commit, stamped
# minutes after the merge. Render built the right thing and serves the leftovers beside it.
# Not a cache either — cache-busted requests return cf-cache-status: MISS and still 200.
#
# "Clear build cache & deploy" DOES NOT FIX THIS, and was tried. The build cache concerns
# build inputs, not the published output directory.
#
# ⚠ AN EXTENSIONLESS 404 IS NOT EVIDENCE. /knowledge returns 404 while /knowledge.html
# serves 43KB — Render resolves clean URLs against the current deploy's manifest but serves
# any file that physically exists at an explicit path. The first check on this made exactly
# that mistake and reported the pages pruned when they were not. Always ask for the file.
#
# To actually remove something: empty the published directory, which means recreating the
# static site (or a Render support ticket). Recreating is also the moment to fix the apex
# redirect noted above — add www.asktic.com FIRST and Render creates the apex as its
# redirect. Then verify each retired URL 404s to a cache-busted request WITH its extension.
#
# See content/_retired/README.md for the full account.
#
# OUTSTANDING: the apex does not redirect to www. Both asktic.com and www.asktic.com
# serve the site, so every page answers on two hostnames. Canonical tags in
# app/layout.tsx point at www and make that harmless, but a 301 is better.
#
# It cannot be fixed with a route below: Render matches `source` on path only, so a
# `/* -> https://www.asktic.com/:splat` rule would match www's own requests and loop.
# Render's own mechanism is per-domain, and per its docs the direction is decided by
# which hostname you add FIRST — adding `www` auto-adds the apex as a redirect to it,
# and vice versa. Both were added explicitly here on 2026-08-12, so neither became a
# redirect.
#
# To fix: remove both custom domains and re-add ONLY www.asktic.com, letting Render
# create the apex as its redirect. Do it in the dashboard and expect a brief window
# where the custom domain is unconfigured — the site is live, and re-issuing the TLS
# certificate took about ten minutes at cutover. Not worth doing casually mid-day.
#
# All redirects live here rather than in next.config.ts. With `output: 'export'` Next's
# `redirects()` is inert — it emits a build warning and does nothing — so the platform
# has to serve them. `type: redirect` is a 301.
#
# The generated block below is written by `npm run gen:redirects` from
# content/_inventory/freshdesk/redirects.json. Do not hand-edit between the markers.
#
# support.asktic.com is NOT handled here. Freshdesk Solutions is parked, not retired, so
# that hostname keeps pointing at Freshdesk and its article URLs keep working as they do
# today. The generated block below stays empty by design.
#
# help.asktic.com is handled by a SECOND service (tic-help-redirect, below) rather than
# by a route on this one. Render matches `source` on path only, with no host component,
# so a `/ -> /knowledge` rule here would also hijack www.asktic.com/ and break the
# homepage. A separate service with its own custom domain is the way to scope a redirect
# to one hostname.

services:
  # NEVER attach an environment group to this service — specifically not
  # `tic-crm-shared`, which holds ~93 Rainmaker CRM variables including database
  # credentials and carrier API keys. tic-web sits in the same Render project as the
  # CRM services today but is not linked to any of them, and must stay that way: this
  # is a STATIC build, so any env var it can read is baked into published HTML and
  # served to the public.
  #
  # As of 2026-08-11 the site needs NO environment variables, because the contact form
  # is disabled — precisely because the one variable it needs is not configured.
  #
  # If it is re-enabled (see app/employee-benefits/page.tsx), it needs exactly one:
  #
  #   NEXT_PUBLIC_N8N_CONTACT_WEBHOOK
  #
  # It is safe to bake in — it is a public endpoint by design, which is why n8n has to
  # do its own validation and rate limiting. Set it individually on this service, never
  # via a group. Set the variable BEFORE restoring the form, not after: until it is set
  # the form renders but cannot submit, which is the state the form was disabled over.
  # That is the only variable this service may ever hold.
  - type: web
    name: tic-web
    runtime: static
    # NOTE this is NOT the command Render runs — the service uses its own
    # `npm run build` (see the header). Kept as the correct command for anyone adopting
    # this blueprint or rebuilding the service.
    #
    # `--include=dev` matters only if the install step runs with NODE_ENV=production,
    # under which `npm ci` skips devDependencies — and every tool this build needs is
    # one: tailwindcss and @tailwindcss/postcss compile the CSS, typescript type-checks,
    # tsx runs the build stamp. Verified in a clean clone that `NODE_ENV=production npm
    # ci && npm run build` fails on the Tailwind PostCSS plugin while the form below
    # succeeds. Render's own static-site install includes dev dependencies, which is why
    # the live service builds fine without it.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false

    routes:
      # ---- Wix path changes (hard requirement: every other path stays as-is) ----
      - type: redirect
        source: /home-1
        destination: /

      # ✓ /file-access AND /file ARE GONE, from this file and from the service. Both used
      # to 301 to /forms; /forms was retired on 2026-08-17 and its library moved into the
      # CRM, which left each of them redirecting into a 404. Removed here and deleted in
      # the Render dashboard on the same day. Verified live 2026-08-18 after the deletion:
      # both now return a direct 404 and send no Location header.
      #
      # Kept as a note rather than deleted, for the one lesson in it: removing them here
      # did nothing by itself. The service's routes are configured in the dashboard and
      # this file does not govern it, so a route change is two changes. `verify:urls`
      # cannot catch the gap either — it asserts a redirect-only path emits no artifact in
      # out/, which says nothing about what Render serves.
      #
      # They were deleted rather than repointed on purpose. A 301 into a 404 costs a hop to
      # deliver the same disappointment as a direct 404, and there is no honest destination
      # for a file library that no longer exists publicly. /services was considered and
      # rejected: a redirect to unrelated content is the soft-404 pattern this file warns
      # about a few lines below.

      # ---- Copy-deck path changes, 2026-08-16 ----
      # These two are a deliberate, signed-off exception to URL preservation: both were
      # `preserved` and indexed until the homepage copy deck moved them. Each 301s to a
      # topically equivalent page, which is why a redirect is right here and was wrong
      # for the dropped Wix store URLs (see content/_inventory/url-decisions.md — a 301
      # to unrelated content is a soft-404 pattern).
      #
      # /blog served the Services landing page, not a blog index. Its 12 posts live at
      # /single-post/... and are untouched.
      - type: redirect
        source: /blog
        destination: /services

      # NOT to /services. The marine and oil and gas specialty product was dropped but
      # its audience was not, so the search equity follows the audience.
      - type: redirect
        source: /speciality-insurance
        destination: /offshore-and-energy

      # Retired on the owner's instruction, 2026-08-16. A functioning service page rather
      # than template junk, so it 301s to the service index rather than 404ing.
      - type: redirect
        source: /income-preservation-1
        destination: /services

      # /projects is NOT here, and its absence is the decision. It was briefly given a 301
      # to /services on the assumption that an indexed path is always worth preserving.
      # It is not: the Wix original was an unfinished template with no original content,
      # and the owner retired it as "legacy and a mistake from the old site". It now sits
      # in content/url-contract.json -> dropped and 404s deliberately, which is also why
      # there is nothing to add to the service for it.

      # ⚠ BEFORE RUNNING `npm run gen:redirects`, READ THIS.
      #
      # content/_inventory/freshdesk/redirects.json carries destination slugs with an
      # insurer's name in them, e.g. /knowledge/allianz-family-policy-number-access-rules.
      # Generating from it as-is would publish insurer names in this file, in the live
      # redirect config, and in the destination URLs themselves — and the site names no
      # insurer in public copy. `npm run verify:copy` cannot catch it, because a redirect
      # rule is service configuration and never appears in out/.
      #
      # Those four articles are an archive that must not be ported at all (see
      # content/_inventory/_capture-status.md), so their destinations do not exist either.
      # Rename the slugs, or drop those entries, before generating.
      #
      # BEGIN GENERATED freshdesk-article-map
      # (empty until `npm run ingest:freshdesk` has run)
      # END GENERATED freshdesk-article-map

  # ---------------------------------------------------------------------------
  # help.asktic.com -> https://www.asktic.com/knowledge
  #
  # A standalone service whose only job is to redirect one hostname. It exists
  # because Render's redirect rules cannot match on host: putting this rule on the
  # main site would apply it to www.asktic.com too.
  #
  # Attach `help.asktic.com` as a custom domain on THIS service (not on tic-web),
  # then point its DNS at Render.
  #
  # ⚠⚠ DO NOT CREATE THIS SERVICE. ITS DESTINATION IS A 404 (added 2026-08-18).
  # It redirects to https://www.asktic.com/knowledge, and /knowledge was retired on
  # 2026-08-17 — verified live as a 404 on 2026-08-18. A service whose entire purpose is
  # pointing one hostname at a dead page is worse than no service.
  #
  # It is harmless TODAY only because two things are both true: the hostname does not
  # exist, and this file is not applied as a Blueprint. Adopting the file would create it.
  # If a public answers surface ever returns, repoint this at the new destination in the
  # same change; if it does not, delete this service definition outright.
  #
  # READ THIS BEFORE SPENDING ANY TIME ON THIS SERVICE (2026-08-11):
  # `help.asktic.com` DOES NOT EXIST. It resolves NXDOMAIN today, and the zone
  # inventory has no `help` record — the KB subdomain that exists is
  # `support.asktic.com`, a CNAME to asktic.freshdesk.com. The live Wix nav's
  # "Knowledge Base" item points at http://help.asktic.com, so that link is dead on
  # the current site.
  #
  # So this service is not "waiting on DNS" — there is no record to move. It only
  # becomes useful if someone decides to CREATE help.asktic.com and point it here.
  # Nothing in the rebuild depends on that: this site's own nav links to /knowledge
  # directly. Left in place because it costs nothing and the decision is not ours.
  #
  # Separately (decision 2026-08-11): the domain is NOT moving to Vodien. Wix stays
  # authoritative for the zone, so cutover is record surgery in Wix's DNS rather than a
  # nameserver move — see the cutover section in README.md, including the warning about
  # the Google Workspace MX records that live in the same zone.
  #
  # TWO UNVERIFIED ASSUMPTIONS — check before relying on this. render.com is
  # blocked by this environment's egress policy, so neither could be confirmed:
  #   1. that `destination` accepts an absolute off-site URL
  #   2. that `source: /*` matches the root path as well as sub-paths
  # If either is wrong the fix is local to this service and cannot affect tic-web.
  - type: web
    name: tic-help-redirect
    runtime: static
    # No build: the service only ever answers with a redirect. The placeholder page
    # is what gets served if a request somehow misses the rule below.
    buildCommand: mkdir -p out && printf '<!doctype html><meta http-equiv="refresh" content="0;url=https://www.asktic.com/knowledge">' > out/index.html
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    routes:
      - type: redirect
        source: /*
        destination: https://www.asktic.com/knowledge
